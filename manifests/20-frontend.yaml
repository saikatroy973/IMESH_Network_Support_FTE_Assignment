##############################################################################
# frontend - the middle hop of the application flow (client -> frontend -> backend)
#
# The frontend serves its own status page on / and reverse-proxies /api/ to the
# backend Service.  The /api/ route is what a real user would notice breaking,
# while client -> frontend itself keeps working.
##############################################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: imesh-demo
data:
  nginx.conf: |
    worker_processes auto;
    error_log  /dev/stderr warn;
    pid        /run/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;

      access_log    /dev/stdout;
      error_log     /dev/stderr warn;

      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;

      server {
        listen 8080;
        server_name frontend;

        location = /healthz {
          access_log off;
          default_type text/plain;
          return 200 "ok\n";
        }

        # Frontend's own status page - reached directly by the client workload.
        location / {
          default_type text/plain;
          return 200 "FRONTEND-OK  pod=$hostname  client=$remote_addr\n";
        }

        # Frontend -> backend hop.  This is the leg that the assignment breaks.
        location /api/ {
          proxy_pass http://backend.imesh-demo.svc.cluster.local:80/;
          proxy_connect_timeout 3s;
          proxy_read_timeout    5s;

          # Surface the upstream failure to the caller instead of a bare 502 page.
          proxy_intercept_errors on;
          error_page 502 503 504 = @upstream_down;
        }

        location @upstream_down {
          default_type text/plain;
          return 502 "FRONTEND-UPSTREAM-ERROR  frontend could not reach backend\n";
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: imesh-demo
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: imesh-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: imesh-demo
    spec:
      nodeSelector:
        imesh.ai/role: worker
      containers:
        - name: frontend
          image: imesh-demo-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: imesh-demo
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: imesh-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
